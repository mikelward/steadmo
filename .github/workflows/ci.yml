name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions: {}

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5.0.2
        with:
          cache-read-only: ${{ github.event_name != 'push' }}

      - name: Core tests, without Android
        run: ./gradlew :core:test

      - name: Unit tests and screenshots
        # Re-records every screenshot; the drift check below fails if any changed.
        run: ./gradlew test -Proborazzi.test.record=true

      - name: Coverage
        run: ./gradlew koverVerify koverHtmlReport

      - name: Fail on screenshot drift
        run: |
          if [ -n "$(git status --porcelain -- app/src/test/snapshots/images)" ]; then
            git status --porcelain -- app/src/test/snapshots/images
            echo "::error::Recorded screenshots differ from the committed ones; re-record (./gradlew test -Proborazzi.test.record=true) and commit them."
            exit 1
          fi

      - name: Print failing test details
        if: failure()
        run: |
          shopt -s nullglob globstar
          for xml in */build/test-results/**/TEST-*.xml; do
            if grep -q "<\(failure\|error\)" "$xml"; then
              echo "::group::$xml"
              cat "$xml"
              echo "::endgroup::"
            fi
          done

      - name: Lint
        run: ./gradlew lint

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: steadmo-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload screenshots and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: screenshots-and-coverage
          path: |
            app/src/test/snapshots/images/
            build/reports/kover/
          if-no-files-found: ignore
